server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_ms: 5000
  write_timeout_ms: 5000
  inspect_timeout_ms: 500
  max_prompt_bytes: 65536

audit:
  path: "audit.jsonl"

policy:
  default_action: "allow"
  deny_threshold: 0.8
  rules_file: "config/policy_rules.yaml"
  deny_message: "Your request was blocked by the content policy."  # custom deny message

telemetry:
  service_name: "semantic-firewall"
  service_version: "0.3.0"
  exporter_type: "stdout"        # "stdout" or "otlp"
  metrics_exporter: "prometheus" # "prometheus" or "stdout"
  otlp_endpoint: "http://localhost:4318"

rate_limit:
  enabled: true
  rps: 10.0
  burst: 20
  ttl_seconds: 3600  # evict idle per-caller limiters after 1 hour; 0 = no eviction

auth:
  enabled: false
  api_keys: []
  # api_keys:
  #   - "secret-key-1"
  #   - "secret-key-2"

alert:
  webhook_url: ""    # POST target for alert-action rules; empty = disabled
  timeout_ms: 5000
